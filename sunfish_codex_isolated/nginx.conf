user nginx;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # Regex keys are case-sensitive; literal nginx map keys are not.
    # Supervisor strips caller-supplied identity headers and injects session ID.
    map $http_x_remote_user_id $codex_allowed_user {
        default 0;
        ~^__ALLOWED_USER_ID__$ 1;
    }
    server {
        listen 8099;
        # HA's documented authenticated Ingress proxy, not arbitrary app peers.
        allow 172.30.32.2;
        deny all;
        # Missing, different, comma-joined, or malformed identities fail closed.
        if ($codex_allowed_user = 0) { return 403; }
        location / {
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
