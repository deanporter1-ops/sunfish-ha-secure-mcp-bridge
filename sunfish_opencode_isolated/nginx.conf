user nginx;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # A case-sensitive exact ID is required in addition to the proxy source.
    map $http_x_remote_user_id $opencode_allowed_user {
        default 0;
        ~^__ALLOWED_USER_ID__$ 1;
    }
    server {
        listen 8099;
        allow 172.30.32.2;
        deny all;
        if ($opencode_allowed_user = 0) { return 403; }
        location / {
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
